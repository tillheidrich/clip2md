# Sicherheitsheader. MUSS in jeden location-Block eingebunden werden, der ein
# eigenes add_header setzt - nginx vererbt add_header nicht in solche Bloecke hinein.
#
# connect-src: 'self' ist Pflicht, nicht Kosmetik. Mit 'none' kann auch der Service
# Worker nichts laden - er cacht beim Installieren nichts und liefert bei jeder
# Navigation den Offline-Fall. Die Seite friert dann auf dem Stand ein, der vor der
# CSP gecacht wurde, und kann sich nie wieder selbst aktualisieren (Safari, 09/2026).
# Fremde Ziele bleiben gesperrt, erlaubt ist nur die eigene Domain.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; worker-src 'self'" always;
